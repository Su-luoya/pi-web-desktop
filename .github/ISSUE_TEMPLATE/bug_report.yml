name: Bug report
description: 报告可以复现的行为问题。
title: "[Bug] "
labels:
  - "type: bug"
  - "status: needs-reproduction"
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。不要在公开内容中填写密码、token、代理凭据、私有路径或完整日志。
  - type: input
    id: app_version
    attributes:
      label: Pi Web Desktop 版本
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 请填写 macOS 版本、Mac 芯片、Node.js、Pi 和 Pi Web 版本。
      placeholder: macOS 14.x, Apple Silicon, Node 24.x, Pi 0.x, Pi Web 0.x
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围（area 标签）
      description: 维护者会按选择设置 `area:` 标签。
      multiple: true
      options:
        - app — 应用生命周期和 UI
        - service — Pi Web 服务管理
        - diagnostics — 诊断和日志
        - security — 网络、进程和凭据安全
        - updates — 版本检查和更新
        - build-release — 构建、CI 和发布
        - documentation — 项目文档
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 影响程度（priority 标签建议）
      description: 维护者在分诊时确认；P0 表示安全、数据损坏或广泛不可启动。
      options:
        - P0 — 安全、数据损坏或广泛不可启动
        - P1 — 里程碑阻塞
        - P2 — 正常计划工作
        - P3 — 可延后改进
    validations:
      required: true
  - type: textarea
    id: installation
    attributes:
      label: 安装来源
      description: 请说明应用、Pi 和 Pi Web 的安装方式，例如源码、alpha ZIP、npm、Homebrew 或其他工具。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或诊断信息
      description: 只粘贴已移除用户名、Home 路径、token、密码、代理凭据和查询参数的内容。
      render: text
    validations:
      required: false
