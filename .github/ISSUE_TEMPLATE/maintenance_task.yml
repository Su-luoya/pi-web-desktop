name: Maintenance task
description: 记录一个可独立合并的维护、构建、测试或文档任务。
title: "[Maintenance] "
labels:
  - "type: maintenance"
  - "status: needs-decision"
body:
  - type: markdown
    attributes:
      value: |
        进入 Orca 前，Issue 必须满足 Definition of Ready。不要在公开内容中放入凭据或私人诊断数据。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围（area 标签）
      description: 维护者会按选择设置 `area:` 标签。
      multiple: true
      options:
        - app — 应用生命周期和 UI
        - service — Pi Web 服务管理
        - diagnostics — 诊断和日志
        - security — 网络、进程和凭据安全
        - updates — 版本检查和更新
        - build-release — 构建、CI 和发布
        - documentation — 项目文档
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 影响程度（priority 标签建议）
      description: 维护者在分诊时确认。
      options:
        - P0 — 安全、数据损坏或广泛不可启动
        - P1 — 里程碑阻塞
        - P2 — 正常计划工作
        - P3 — 可延后改进
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target
      description: 要改变的组件、文件或发布流程。
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Change
      description: 需要完成的具体变更。
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: 安全、兼容、依赖和范围限制。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance
      description: 可执行命令或可观察结果。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: 列出阻塞 Issue；没有依赖请填写“无”。
    validations:
      required: true
