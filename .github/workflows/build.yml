name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test Xcode project
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="$(mktemp -d "${RUNNER_TEMP}/PiWebDesktopDerivedData.XXXXXX")"
          trap 'rm -rf "$DERIVED_DATA_PATH"' EXIT
          XCODEBUILD_ARGS=(
            -project PiWebDesktop.xcodeproj
            -scheme PiWebDesktop
            -sdk macosx
            -derivedDataPath "$DERIVED_DATA_PATH"
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY=-
          )
          xcodebuild "${XCODEBUILD_ARGS[@]}" build
          xcodebuild "${XCODEBUILD_ARGS[@]}" test
      - name: Build app
        run: ./Scripts/build.sh
      - name: Verify ad-hoc signature
        run: codesign --verify --deep --strict build/Pi-Web-Desktop.app
      - name: Check for accidental personal data
        run: |
          ! git grep -nE 'taila|127\.0\.0\.1:7890|/Users/[^/]+' -- ':!*.icns' ':!.github/workflows/build.yml'
      - name: Check shell scripts
        run: sh -n Scripts/build.sh Scripts/install.sh
      - name: Package smoke artifact
        run: ditto -c -k --sequesterRsrc --keepParent build/Pi-Web-Desktop.app Pi-Web-Desktop-alpha.zip
      - name: Checksum
        run: shasum -a 256 Pi-Web-Desktop-alpha.zip
