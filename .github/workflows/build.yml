name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test Xcode project
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="$(mktemp -d "${RUNNER_TEMP}/PiWebDesktopDerivedData.XXXXXX")"
          XCODEBUILD_ARGS=(
            -project PiWebDesktop.xcodeproj
            -scheme PiWebDesktop
            -sdk macosx
            -derivedDataPath "$DERIVED_DATA_PATH"
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY=-
          )
          xcodebuild "${XCODEBUILD_ARGS[@]}" build
          xcodebuild "${XCODEBUILD_ARGS[@]}" test
          XCODE_APP_PATH="$DERIVED_DATA_PATH/Build/Products/Debug/PiWebDesktop.app"
          if [ ! -d "$XCODE_APP_PATH" ]; then
            XCODE_APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products" -maxdepth 2 -type d -name PiWebDesktop.app -print -quit)"
          fi
          test -d "$XCODE_APP_PATH"
          {
            echo "DERIVED_DATA_PATH=$DERIVED_DATA_PATH"
            echo "XCODE_APP_PATH=$XCODE_APP_PATH"
          } >> "$GITHUB_ENV"
          echo "Xcode product: $XCODE_APP_PATH"
      - name: Build app
        run: ./Scripts/build.sh
      - name: Verify ad-hoc signature
        run: codesign --verify --deep --strict build/Pi-Web-Desktop.app
      - name: Smoke launch
        run: ./Scripts/smoke.sh
      - name: Check application identity of Xcode and script builds
        run: |
          set -euo pipefail
          trap 'rm -rf "$DERIVED_DATA_PATH"' EXIT
          ./Scripts/check-identity.sh --test-bundle "$DERIVED_DATA_PATH/Build/Products/Debug/PiWebDesktopTests.xctest" "$XCODE_APP_PATH" build/Pi-Web-Desktop.app
      - name: Check for accidental personal data
        run: |
          ! git grep -nE 'taila|127\.0\.0\.1:7890|/Users/[^/]+' -- ':!*.icns' ':!.github/workflows/build.yml' ':!Scripts/check-identity.sh'
      - name: Check shell scripts
        run: sh -n Scripts/build.sh Scripts/install.sh Scripts/check-identity.sh Scripts/smoke.sh
      - name: Package smoke artifact
        run: ditto -c -k --sequesterRsrc --keepParent build/Pi-Web-Desktop.app Pi-Web-Desktop-alpha.zip
      - name: Checksum
        run: shasum -a 256 Pi-Web-Desktop-alpha.zip
